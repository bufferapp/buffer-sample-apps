name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-client-starter-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-client-starter-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-client-starter-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
