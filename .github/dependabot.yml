version: 2
updates:
  # Each sample app needs its own entry, pointing at the folder that holds its package.json.
  - package-ecosystem: npm
    directory: /samples/app-client-starter-app
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
